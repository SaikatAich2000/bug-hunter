# =============================================================================
#  SonarQube project configuration for Bug Hunter
# -----------------------------------------------------------------------------
#  Read by `sonar-scanner` (CLI) or `sonar-scanner-cli` (Docker image) from the
#  repo root. It does NOT need a SONAR_TOKEN baked in — pass it on the CLI:
#
#      sonar-scanner \
#        -Dsonar.host.url=http://localhost:9000 \
#        -Dsonar.login=$SONAR_TOKEN
#
#  Or use the bundled helper which also runs pytest with coverage:
#
#      ./scripts/sonar-scan.sh
#
#  Nothing in this file touches the database, the bugtracker_pgdata
#  volume, or any runtime state — SonarQube is purely a static-analysis
#  tool that reads source files.
# =============================================================================

# --- Project identity -------------------------------------------------------
# Keep this stable across analyses so SonarQube can show issue-trend graphs.
# sonar.projectVersion is intentionally NOT set here: a literal in this file is
# a second copy of the product version that drifts out of lockstep with .env.
# It is supplied at scan time from APP_VERSION instead —
#   * CI:  .github/workflows/build-and-push.yml passes -Dsonar.projectVersion
#          from the APP_VERSION repository variable.
#   * Local: scripts/sonar-scan.sh reads APP_VERSION from .env and passes it.
sonar.projectKey=Bug-Hunter
sonar.projectName=Bug Hunter

# --- Sources & tests --------------------------------------------------------
# `sonar.sources` lists directories scanned as "production code": the Python
# backend and the maintainable SPA source. Generated/minified build output
# (app/static/assets/**) is excluded below instead of being analysed.
# Tests are listed separately so SonarQube applies test-specific rules (and
# doesn't count test code in the duplication / complexity metrics for prod).
sonar.sources=app,frontend/src
sonar.tests=tests

# UTF-8 — the SPA emits UTF-8 HTML; the backend reads UTF-8.
sonar.sourceEncoding=UTF-8

# --- Language settings ------------------------------------------------------
# Python: tell SonarPython which version to lint against. 3.12 is the
# version pinned in the Dockerfile.
sonar.python.version=3.12

# JavaScript: only frontend/src is analysed; node_modules, .claude (agent
# worktrees, each a full repo copy) and coverage output are excluded below.

# --- Coverage --------------------------------------------------------------
# Backend: generated by `pytest --cov` (see requirements-dev.txt +
# scripts/sonar-scan.sh). Frontend: generated by `npm run test:coverage`
# (Vitest + @vitest/coverage-v8 writes frontend/coverage/lcov.info).
# Paths are relative to the project root.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# `sonar.coverage.exclusions` decides which files count toward the Coverage%
# denominator. Only non-source files are excluded: everything under app/ (Python,
# measured by pytest-cov) and frontend/src (JS/JSX, measured by Vitest LCOV) is in
# scope, UI components included.
#   * Vitest specs live beside the source under frontend/src but are test code.
#   * app/static/** is generated Vite output plus vendored swagger-ui/firebase.
#   * *.min.js is minified third-party output.
sonar.coverage.exclusions=  **/*.test.*,  **/*.spec.*,  app/static/**,  **/*.min.js

# --- Test execution report -------------------------------------------------
# CI writes junit-parts/junit.xml (the coverage-report artifact ships that
# directory to the scan job); scripts/sonar-scan.* write a single junit.xml.
# The glob matches both and feeds the Measures > Tests pane.
sonar.python.xunit.reportPaths=junit.xml,junit-parts/*.xml

# --- Inclusion / exclusion rules -------------------------------------------
# Things to scan:
#   * app/             — Python backend (+ the static HTML the SPA is served from)
#   * tests/           — pytest test files
# Things to skip (cruft that would pollute metrics):
#
# app/static/assets/** is the **Vite build output** — content-hashed, bundled,
# transpiled JS/CSS produced from frontend/src. It is generated build artifact,
# not reviewable source (the real source lives in frontend/, which has its own
# review path), so it is excluded for the same reason **/dist/** and **/build/**
# are. Scanning the bundle only yields un-actionable, minified findings and
# security hotspots on React's compiled `dangerouslySetInnerHTML` → `innerHTML`
# writes, which are already safe by construction (the HTML is sanitized
# server-side in app/schemas.py before it is ever stored or returned).
#
# app/static/swagger-ui/** is vendored third-party UI (swagger-ui-dist@5 /
# redoc@2), the same category as app/static/vendor/**: never our source, and
# redoc.standalone.js alone is ~1.6k lines of minified vendor JS that would
# otherwise count as reviewable new code on every docs-asset bump.
sonar.exclusions=\
  **/__pycache__/**,\
  **/*.pyc,\
  **/node_modules/**,\
  **/.venv/**,\
  **/venv/**,\
  **/.pytest_cache/**,\
  **/.mypy_cache/**,\
  **/.ruff_cache/**,\
  **/dist/**,\
  **/build/**,\
  **/models/**,\
  **/.playwright-mcp/**,\
  **/htmlcov/**,\
  coverage.xml,\
  junit.xml,\
  app/static/assets/**,\
  app/static/vendor/**,\
  app/static/swagger-ui/**,\
  app/static/fonts/**,\
  **/*.png,\
  **/*.woff2,\
  **/*.min.js,\
  **/*.min.css

# Don't apply test-specific rules to source files; don't apply source rules
# to test files. The separation keeps "Code smells in tests" out of the prod
# code quality gate. Frontend Vitest specs sit INSIDE sonar.sources
# (frontend/src), so they must be declared here too — otherwise Sonar treats
# them as production code that simply has no coverage data.
sonar.test.inclusions=tests/**/*.py,frontend/src/**/*.test.*,frontend/src/**/*.spec.*
sonar.test.exclusions=app/**

# Files copied INTO the image at build time aren't useful to scan twice —
# we skip the Dockerfile-mirrored paths. (Dockerfile itself IS scanned by
# the IaC analyzer.)

# --- Duplication threshold --------------------------------------------------
# Left at Sonar's default (100 lines) so genuine copy-paste is still reported;
# no threshold override is used to hide duplication.

# --- Issue handling ---------------------------------------------------------
# No project-level issue suppression is configured. Correctness, security, and
# maintainability findings must be fixed or reviewed individually in SonarQube.

# --- Quality gate ------------------------------------------------------------
# The project gate is created/refreshed by `python scripts/sonar_gate.py apply`
# (needs SONAR_TOKEN). Its conditions are:
#
#   * Coverage (overall)          at least 80%
#   * Coverage on new code        at least 80%
#   * Security rating             = A     and Vulnerabilities       = 0
#   * Security rating on new code = A     and New vulnerabilities   = 0
#   * Everything else the copied "Sonar way" carries for new code: on
#     SonarQube 10+ that is "no new issues" (new_violations = 0, stricter than
#     the per-rating conditions older servers used: new reliability and
#     maintainability rating = A) and duplicated lines on new code <= 3%
#   * "Security hotspots reviewed" is intentionally NOT a condition: hotspot
#     triage is manual work and must not block every image build. Hotspots are
#     still reported in the SonarQube UI; genuine vulnerabilities remain
#     blocked by the ratings/counts above.
#
# 80% is the same floor as `fail_under` in pyproject.toml and the coverage
# numbers shown in README.md ("Coverage policy"). scripts/sonar-scan.* pass
# -Dsonar.qualitygate.wait=true so the scan exits non-zero when the gate fails.
