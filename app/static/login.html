<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#171a21" />
  <title>Bug Hunter — Sign in</title>
  <link rel="icon" type="image/png" href="/static/icon.png?v=__ASSET_VERSION__" />
  <!--
    No inline theme-bootstrap script here: the app's strict Content
    Security Policy (script-src 'self', no 'unsafe-inline') blocks inline
    scripts. src/login/main.tsx applies the persisted theme to
    <html data-theme> before the React tree renders.
  -->
  <script type="module" crossorigin src="/static/assets/login-PUM0c_Hk.js"></script>
  <link rel="modulepreload" crossorigin href="/static/assets/rich-editor-BE-k0tRo.js">
  <link rel="modulepreload" crossorigin href="/static/assets/styles-CKxdFlPw.js">
  <link rel="stylesheet" crossorigin href="/static/assets/styles-V1AhdLqa.css">
</head>
<body class="auth-body">
  <div id="root"></div>
  <!-- Server-rendered version line: _serve_html() substitutes
       __APP_VERSION__ in HTML responses (NOT in JS bundles), and the
       backend regression test asserts "Version X.Y" appears in the raw
       login-page HTML. Kept outside #root so React never touches it. -->
  <p class="auth-version" aria-label="Application version">Version __APP_VERSION__</p>
</body>
</html>
