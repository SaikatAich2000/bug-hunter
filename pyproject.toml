[tool.coverage.run]
source = ["app"]
relative_files = true
branch = true
omit = [
    "tests/*",
    "*/__pycache__/*",
    # Sleuth's OPTIONAL external-AI layers. Each only runs when wired to a
    # live external dependency the hermetic test suite deliberately never
    # provisions — local llama.cpp + a GGUF model (llm), the Gemini /
    # OpenRouter cloud APIs (cloud_llm), and a chromadb vector store (rag).
    # "Sleuth runs out of the box with NO config" (.env.example), so these
    # paths are unreachable without network/model files. They are still
    # fully SonarQube-scanned for code quality — only excluded from the
    # unit-test coverage denominator (mirrors how the frontend is handled).
    "app/chatbot/llm.py",
    "app/chatbot/cloud_llm.py",
    "app/chatbot/rag.py",
    # The FCM web-push transport — only runs against a live Firebase project
    # (service-account + network) the test suite never provisions; the
    # orchestration around it (app/push_service.py) IS covered, with the
    # transport mocked.
    "app/fcm_transport.py",
]

[tool.coverage.report]
# CI gate: fail the run if total coverage falls below this floor.
fail_under = 99
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    # `if TYPE_CHECKING:` blocks hold import-only type aliases that never
    # execute at runtime, so they can't be covered by tests — exclude them
    # from the denominator (standard coverage.py practice).
    "if TYPE_CHECKING:",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Registered markers — run `-m "not ui"` to skip the slow browser E2E suite.
markers = [
    "ui: Playwright browser end-to-end tests (slow, requires Chromium)",
    "slow: long-running tests",
    "migration: legacy-database re-import tests",
]
# Python 3.14 + pytest-cov: gzip-buffered coverage files get finalized
# after their underlying file is closed, raising ValueError inside
# __del__. Pytest catches these via sys.unraisablehook and turns them
# into PytestUnraisableExceptionWarning. They're harmless — coverage
# data lands correctly — but they flood the output. Silence the noise.
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
