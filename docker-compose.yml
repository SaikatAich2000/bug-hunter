# Bug Hunter — fully isolated stack.
#
# Designed for a host that already runs other services (including a
# Postgres on the default port 5432). Everything here lives on its own
# bridge network and uses a named volume that is unlikely to clash:
#
#   • App is exposed on host port 8765 (container 8000)
#   • Postgres is exposed on host port 55432 (container 5432)
#   • Network:  bugtracker_net
#   • Volume:   bugtracker_pgdata
#
# Nothing here uses the host's Postgres — the app talks to the
# `db` service over the internal Docker network only.

services:
  db:
    image: postgres:16-alpine
    container_name: bugtracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bugtracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bugtracker_pw}
      POSTGRES_DB: ${POSTGRES_DB:-bugtracker}
    volumes:
      - bugtracker_pgdata:/var/lib/postgresql/data
    ports:
      # Bound to 127.0.0.1 ONLY: the app reaches Postgres over the internal
      # bugtracker_net network (see DATABASE_URL below), so this mapping exists
      # purely for local admin/debugging on the host. Binding to localhost keeps
      # the DB off the LAN/internet — important because POSTGRES_PASSWORD has a
      # well-known default. Host side is non-default to avoid colliding with any
      # Postgres already on 5432.
      - "127.0.0.1:55432:5432"
    networks:
      - bugtracker_net
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-bugtracker} -d ${POSTGRES_DB:-bugtracker}
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"       # max 50 % of one CPU core
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

  # Run a SINGLE app worker (the image's default CMD does). The login/lockout
  # rate limiters and the in-app email-digest scheduler keep per-process state,
  # so scaling to multiple workers/replicas weakens the limits and can duplicate
  # the digest. To scale out, front with a shared limiter (e.g. nginx limit_req)
  # and run the digest from one place (host cron, or a single scheduler worker).
  app:
    build:
      context: .
      args:
        # Lets sites behind a proxy / air-gapped network override the
        # FROM image without editing the Dockerfile. Default mirrors
        # the Dockerfile's hard-coded fallback.
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
    image: bugtracker_app:3.0
    container_name: bugtracker_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The app talks to Postgres via the internal Docker DNS name `db`,
      # not via the host port mapping above.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bugtracker}:${POSTGRES_PASSWORD:-bugtracker_pw}@db:5432/${POSTGRES_DB:-bugtracker}
      # Postgres pool sizing — lower on a very small VM (see .env.example).
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      # Hard ceiling on request body size (bytes); rejected with 413 before the
      # body is read. Raise it for larger file uploads.
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-62914560}
      APP_NAME: ${APP_NAME:-Bug Hunter}
      APP_VERSION: ${APP_VERSION:-3.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Empty default = same-origin only (the app's secure default). Set to your
      # concrete origin(s), e.g. https://bugs.example.com, for cross-origin use.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      API_KEY: ${API_KEY:-}

      # Sleuth cloud AI assistant (optional). OFF unless SLEUTH_CLOUD_ENABLED=1
      # and a key are set in the server's .env. Read from .env via ${...} so
      # the secret value never lives in this committed file.
      SLEUTH_CLOUD_ENABLED: ${SLEUTH_CLOUD_ENABLED:-0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SLEUTH_RAG_ENABLED: ${SLEUTH_RAG_ENABLED:-0}
      # Read-only grounding / agent / evaluation enhancements (all OFF by
      # default, each independent). Passed through so enabling them in .env
      # actually reaches the container.
      SLEUTH_RETRIEVAL_ENABLED: ${SLEUTH_RETRIEVAL_ENABLED:-0}
      SLEUTH_VERIFY_ANSWERS: ${SLEUTH_VERIFY_ANSWERS:-0}
      SLEUTH_AGENT_ENABLED: ${SLEUTH_AGENT_ENABLED:-0}
      SLEUTH_AGENT_MAX_STEPS: ${SLEUTH_AGENT_MAX_STEPS:-4}
      SLEUTH_EVAL_ENABLED: ${SLEUTH_EVAL_ENABLED:-0}
      SLEUTH_EVAL_MIN_SCORE: ${SLEUTH_EVAL_MIN_SCORE:-0.5}
      # Cloud-layer tuning (only relevant when the cloud layer is on).
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-text-embedding-004}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen-2.5-7b-instruct:free}
      SLEUTH_CLOUD_TIMEOUT_S: ${SLEUTH_CLOUD_TIMEOUT_S:-20}
      SLEUTH_CLOUD_MAX_TOKENS: ${SLEUTH_CLOUD_MAX_TOKENS:-600}
      SLEUTH_RAG_TOP_K: ${SLEUTH_RAG_TOP_K:-5}
      # Persist Sleuth conversations to the additive chat_* tables (safe on).
      SLEUTH_CHAT_MEMORY_ENABLED: ${SLEUTH_CHAT_MEMORY_ENABLED:-true}

      # Authentication.
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Interactive API docs (/docs, /redoc): always on in dev, off once
      # COOKIE_SECURE=true (prod) unless forced on here.
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      # Trust X-Forwarded-For only behind a real reverse proxy, so the rate
      # limiter buckets per client IP. Leave false on a direct/edge deploy.
      TRUST_PROXY_FORWARDED_FOR: ${TRUST_PROXY_FORWARDED_FOR:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@bughunter.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe123!}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Admin}

      # Password policy ("changeme" is ALWAYS accepted regardless, so existing
      # accounts keep working). Forgot-password is enumeration-safe by default.
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}
      PASSWORD_REQUIRE_COMPLEXITY: ${PASSWORD_REQUIRE_COMPLEXITY:-true}
      FORGOT_PASSWORD_ENUMERATION_SAFE: ${FORGOT_PASSWORD_ENUMERATION_SAFE:-true}

      # Public URL the email links should point to.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8765}

      # Email — defaults to "console" so emails get logged to stdout.
      # Set EMAIL_BACKEND=smtp and the SMTP_* vars when you want real delivery.
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      EMAIL_FROM: ${EMAIL_FROM:-bugtracker@localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10}

      # Email digest + optional in-app scheduler (no host cron needed when
      # EMAIL_DIGEST_CRON is a cron expression). All pulled from the host .env.
      EMAIL_DIGEST_ENABLED: ${EMAIL_DIGEST_ENABLED:-false}
      EMAIL_DIGEST_LOOKBACK_HOURS: ${EMAIL_DIGEST_LOOKBACK_HOURS:-26}
      EMAIL_DIGEST_CRON: ${EMAIL_DIGEST_CRON:-}
      EMAIL_DIGEST_TIMEZONE: ${EMAIL_DIGEST_TIMEZONE:-}

      # Reports — cap rows a single XLSX export may materialize before 413.
      MAX_REPORT_ROWS: ${MAX_REPORT_ROWS:-50000}

      # Web push (Firebase Cloud Messaging). Pulled from the host .env via ${...}.
      # FCM_CREDENTIALS_FILE is FIXED to the in-container mount path below — the
      # host path in .env does not exist inside the container.
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      FCM_CREDENTIALS_FILE: /app/secrets/firebase-admin.json
      # Public web-app config served to the browser via GET /api/push/config.
      # All five are required for the client SDK to register for push.
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
      FIREBASE_VAPID_KEY: ${FIREBASE_VAPID_KEY:-}
    volumes:
      # Mount the Firebase service-account JSON into the container (read-only)
      # so fcm_transport can initialise the Admin SDK.
      - ./secrets:/app/secrets:ro
    ports:
      - "8765:8000"
    networks:
      - bugtracker_net
    deploy:
      resources:
        limits:
          cpus: "1.00"       # max 1 full CPU core
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

networks:
  bugtracker_net:
    name: bugtracker_net
    driver: bridge

volumes:
  bugtracker_pgdata:
    name: bugtracker_pgdata

