[tool.coverage.run]
source = ["app"]
relative_files = true
branch = true
omit = [
    "tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
# Fail the run if total coverage falls below this floor.
fail_under = 99
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    # TYPE_CHECKING blocks hold import-only type aliases that never run.
    "if TYPE_CHECKING:",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Registered markers — run `-m "not ui"` to skip the slow browser E2E suite.
markers = [
    "ui: Playwright browser end-to-end tests (slow, requires Chromium)",
    "slow: long-running tests",
    "migration: legacy-database re-import tests",
]
# On Python 3.14, pytest-cov can raise a harmless PytestUnraisableExceptionWarning
# when gzip-buffered coverage files finalize after close; silence the noise.
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
